name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run test suite
        run: uv run pytest -q

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Measure coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report -m

  lint:
    name: Lint changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff on changed Python files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git rev-parse --verify "origin/$BASE_REF" >/dev/null
          diff_output=$(git diff --name-only --diff-filter=ACMRT \
            "origin/$BASE_REF...HEAD" -- '*.py')
          if [ -z "$diff_output" ]; then
            echo "No Python files changed."
            exit 0
          fi
          mapfile -t files <<< "$diff_output"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"

      - name: djLint on changed templates
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git rev-parse --verify "origin/$BASE_REF" >/dev/null
          diff_output=$(git diff --name-only --diff-filter=ACMRT \
            "origin/$BASE_REF...HEAD" \
            -- 'src/flask_exts/templates/*.html' \
               'src/flask_exts/templates/**/*.html')
          if [ -z "$diff_output" ]; then
            echo "No templates changed."
            exit 0
          fi
          mapfile -t files <<< "$diff_output"
          uv run python -m djlint "${files[@]}" --check
