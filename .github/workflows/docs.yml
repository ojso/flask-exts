name: Documentation

on:
  push:
    paths:
      - "docs/**"
      - "src/**"
      - "examples/**"
      - "CHANGES.rst"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "examples/**"
      - "CHANGES.rst"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build-docs:
    name: Build Sphinx documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install project and documentation dependencies
        run: uv sync --locked --no-default-groups --group docs

      - name: Build documentation
        run: uv run python -m sphinx -b html docs docs/_build/html -W -n --keep-going
