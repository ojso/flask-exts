[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Flask-Exts"
dynamic = ["version"]
description = "Flask extensions with admin, SQLAlchemy, Babel, forms, fields, widgets, and more."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.rst"]
keywords = ["flask", "admin", "sqlalchemy", "babel", "form", "widget"]
authors = [
  { name = "David Hua", email = "david.dong.hua@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0",
  "WTForms>=3.0",
  "SQLAlchemy>=2.0",
  "flask-babel>=4.0",
  "Flask-Login>=0.6",
  "tablib>=3.0",
  "PyJWT>=2.0",
  "pyotp>=2.0",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "djlint", "ruff"]

[project.urls]
Documentation = "https://flask-exts.readthedocs.io"
Source = "https://github.com/ojso/flask-exts"
Homepage = "https://github.com/ojso/flask-exts"
Issues = "https://github.com/ojso/flask-exts/issues"
Changelog = "https://flask-exts.readthedocs.io/en/latest/changes.html"

[project.entry-points."flask.commands"]
security = "flask_exts.commands:security_cli"
datastore = "flask_exts.commands:datastore_cli"

[tool.hatch.version]
path = "src/flask_exts/__about__.py"
source = "code"

[tool.hatch.build.targets.wheel]
packages = ["src/flask_exts"]

[tool.djlint]
profile = "jinja"
indent = 2
no_indent_inner_html = true
max_attribute_length = 180
max_line_length = 180
sort_attributes = true
preserve_blank_lines = true
ignore = "T003"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
