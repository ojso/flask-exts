{% macro add_modal_button(url, title, content, fields, success_url="", method="POST", size="md", submit_text="", btn_class="btn btn-primary") %}
  <button class="{{ btn_class }}"
          data-csrf-field="{{ config.get('CSRF_FIELD_NAME', 'csrf_token') }}"
          data-csrf-required="{{ 'true' if config.get('CSRF_ENABLED', True) else 'false' }}"
          data-fields="{{ fields | tojson | forceescape }}"
          data-method="{{ method }}"
          data-modal-form
          data-size="{{ size }}"
          data-submit-text="{{ submit_text or gettext('Submit') }}"
          data-success-url="{{ success_url }}"
          data-title="{{ title }}"
          data-url="{{ url }}"
          title="{{ title }}"
          type="button">{{ content }}</button>
{% endmacro %}
