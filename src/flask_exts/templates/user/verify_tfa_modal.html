{% from "macro/form.html" import render_form_fields %}

<div class="modal-header">
  {% block header_text %}<h5 class="modal-title">two factor authentication code</h5>{% endblock %}
  <button class="btn-close" data-bs-dismiss="modal" type="button">
    <span>×</span>
  </button>
</div>
<form action="{{ action or '' }}" enctype="multipart/form-data" method="post">
  <fieldset>
    <div class="modal-body">{{ render_form_fields(form) }}</div>
  </fieldset>
</form>
