<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stimulus Inline Edit — Plugin Registry</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #f5f7fb;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border: 1px solid #e5ebf5;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 16px;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    .editable {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px dashed transparent;
      cursor: pointer;
      transition: all 0.18s ease;
      line-height: 1.5;
    }

    .editable:hover {
      background: #f0f7ff;
      border-color: #bfd8ff;
    }

    .editable.editing {
      background: #edf5ff;
      border-color: #bfd8ff;
      color: #214ea2;
      box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.18);
    }

    .editable-block {
      display: block;
      width: 100%;
      max-width: 420px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px dashed transparent;
      cursor: pointer;
      transition: all 0.18s ease;
      line-height: 1.6;
    }

    .editable-block:hover {
      background: #f0f7ff;
      border-color: #bfd8ff;
    }

    .editable-block.editing {
      background: #edf5ff;
      border-color: #bfd8ff;
      color: #214ea2;
      box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.18);
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }

    .toast {
      display: none;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #166534;
      font-size: 13px;
    }

    .inline-edit-overlay {
      position: fixed;
      z-index: 1000;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #dbeafe;
      border-radius: 10px;
      box-shadow: 0 18px 36px rgba(30, 64, 175, 0.12);
      padding: 8px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .inline-edit-overlay.active {
      display: flex;
      transform: translateY(0);
    }

    .inline-edit-overlay input,
    .inline-edit-overlay textarea,
    .inline-edit-overlay select {
      padding: 6px 8px;
      border: 1px solid #bfd6ff;
      border-radius: 6px;
      font: inherit;
      background: #fff;
      color: #1f2937;
      outline: none;
    }

    .inline-edit-overlay input:focus,
    .inline-edit-overlay textarea:focus,
    .inline-edit-overlay select:focus {
      border-color: #7aaefb;
      box-shadow: 0 0 0 3px rgba(122, 174, 251, 0.15);
    }

    .inline-edit-overlay input,
    .inline-edit-overlay select {
      width: 240px;
    }

    .inline-edit-overlay textarea {
      width: 320px;
      min-height: 88px;
      resize: vertical;
      display: block;
    }

    .inline-edit-overlay .inline-edit-bool {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: #dbeafe;
      border: 1px solid #bfd8ff;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .inline-edit-overlay .inline-edit-bool::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s ease;
    }

    .inline-edit-overlay .inline-edit-bool:checked {
      background: #bfdbfe;
      border-color: #93c5fd;
    }

    .inline-edit-overlay .inline-edit-bool:checked::before {
      transform: translateX(20px);
    }

    .inline-edit-overlay .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 10px;
      border-left: 1px solid #edf3fb;
    }

    .inline-edit-overlay .actions button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .inline-edit-overlay .actions .confirm-btn {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .inline-edit-overlay .actions .confirm-btn:hover {
      background: #d1f0d7;
    }

    .inline-edit-overlay .actions .cancel-btn {
      background: #ffebee;
      color: #c62828;
    }

    .inline-edit-overlay .actions .cancel-btn:hover {
      background: #ffd8dc;
    }

    .inline-edit-overlay.saving .actions button {
      opacity: 0.5;
      pointer-events: none;
    }

    .inline-edit-error {
      position: fixed;
      z-index: 1001;
      display: none;
      padding: 8px 12px;
      border-radius: 6px;
      background: #fff1f2;
      color: #b91c1c;
      border: 1px solid #fecdd3;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
      font-size: 13px;
    }

    .inline-edit-error.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Basic text</h2>
      <span
        class="editable"
        data-controller="inline-edit"
        data-action="click->inline-edit#open"
        data-type="text"
        data-edit-url="/api/user/name"
        data-edit-value="Alice">Alice</span>
      <div class="toast">Saved</div>
    </div>

    <div class="card">
      <h2>Textarea</h2>
      <span
        class="editable editable-block"
        data-controller="inline-edit"
        data-action="click->inline-edit#open"
        data-type="textarea"
        data-edit-url="/api/user/bio"
        data-edit-value="This is a long text field that can be edited inline.">This is a long text field that can be edited inline.</span>
    </div>

    <div class="card">
      <h2>Boolean</h2>
      <span
        class="editable"
        data-controller="inline-edit"
        data-action="click->inline-edit#open"
        data-type="bool"
        data-edit-url="/api/user/notifications"
        data-edit-value="true">true</span>
    </div>

    <div class="card">
      <h2>Number</h2>
      <span
        class="editable"
        data-controller="inline-edit"
        data-action="click->inline-edit#open"
        data-type="number"
        data-edit-url="/api/user/age"
        data-edit-value="28">28</span>
    </div>

    <div class="card">
      <h2>Select</h2>
      <span
        class="editable"
        data-controller="inline-edit"
        data-action="click->inline-edit#open"
        data-type="select"
        data-options="disabled|Disabled,enabled|Enabled,pending|Pending"
        data-edit-url="/api/user/status"
        data-edit-value="enabled">enabled</span>
    </div>
  </div>

  <div class="inline-edit-error"></div>

  <script type="module">
    import { Application, Controller } from "https://cdn.jsdelivr.net/npm/@hotwired/stimulus@3.2.2/dist/stimulus.js";

    class FieldPluginRegistry {
      constructor() {
        this.plugins = new Map();
      }

      register(plugin) {
        if (!plugin || typeof plugin !== "object") {
          throw new Error("Field plugin must be an object");
        }

        const type = String(plugin.type ?? "").toLowerCase();
        if (!type) {
          throw new Error("Field plugin requires a type");
        }
        if (typeof plugin.createField !== "function") {
          throw new Error(`Field plugin "${type}" must implement createField()`);
        }
        if (typeof plugin.setValue !== "function") {
          throw new Error(`Field plugin "${type}" must implement setValue()`);
        }
        if (typeof plugin.getValue !== "function") {
          throw new Error(`Field plugin "${type}" must implement getValue()`);
        }

        this.plugins.set(type, plugin);
        return plugin;
      }

      resolve(type) {
        const key = String(type ?? "text").toLowerCase();
        return this.plugins.get(key) || this.plugins.get("text");
      }

      normalizeType(type) {
        const key = String(type ?? "text").toLowerCase();
        return this.plugins.has(key) ? key : "text";
      }

      createField(type) {
        return this.resolve(type).createField();
      }

      setValue(type, field, value) {
        this.resolve(type).setValue(field, value);
      }

      getValue(type, field) {
        return this.resolve(type).getValue(field);
      }

      buildOptions(type, target, field, originalValue) {
        const plugin = this.resolve(type);
        if (typeof plugin.buildOptions === "function") {
          plugin.buildOptions(target, field, originalValue);
        }
      }
    }

    const fieldPluginRegistry = new FieldPluginRegistry();

    const createInputField = (type, className, attributes = {}) => {
      const field = document.createElement("input");
      field.type = type;
      field.className = className;

      Object.entries(attributes).forEach(([key, value]) => {
        if (value !== undefined && value !== null) {
          field.setAttribute(key, String(value));
        }
      });

      return field;
    };

    const registerBuiltinFieldPlugins = (registry) => {
      registry.register({
        type: "text",
        createField() {
          return createInputField("text", "inline-edit-field inline-edit-input");
        },
        setValue(field, value) {
          field.value = String(value ?? "");
        },
        getValue(field) {
          return field.value.trim();
        }
      });

      registry.register({
        type: "textarea",
        createField() {
          const field = document.createElement("textarea");
          field.className = "inline-edit-field inline-edit-textarea";
          return field;
        },
        setValue(field, value) {
          field.value = String(value ?? "");
        },
        getValue(field) {
          return field.value.trim();
        }
      });

      registry.register({
        type: "bool",
        createField() {
          return createInputField("checkbox", "inline-edit-field inline-edit-bool", {
            "aria-label": "boolean toggle"
          });
        },
        setValue(field, value) {
          field.checked = String(value ?? "").toLowerCase() === "true";
        },
        getValue(field) {
          return field.checked;
        }
      });

      registry.register({
        type: "number",
        createField() {
          return createInputField("number", "inline-edit-field inline-edit-number");
        },
        setValue(field, value) {
          field.value = String(value ?? "");
        },
        getValue(field) {
          return Number(field.value);
        }
      });

      registry.register({
        type: "email",
        createField() {
          return createInputField("email", "inline-edit-field inline-edit-email");
        },
        setValue(field, value) {
          field.value = String(value ?? "");
        },
        getValue(field) {
          return field.value.trim();
        }
      });

      registry.register({
        type: "date",
        createField() {
          return createInputField("date", "inline-edit-field inline-edit-date");
        },
        setValue(field, value) {
          field.value = String(value ?? "");
        },
        getValue(field) {
          return field.value.trim();
        }
      });

      registry.register({
        type: "select",
        createField() {
          const field = document.createElement("select");
          field.className = "inline-edit-field inline-edit-select";
          return field;
        },
        setValue(field, value) {
          const options = Array.from(field.options).map(option => option.value);

          if (options.includes(String(value ?? ""))) {
            field.value = String(value ?? "");
          } else if (field.options.length > 0) {
            field.value = field.options[0].value;
          }
        },
        getValue(field) {
          return field.value;
        },
        buildOptions(target, field, originalValue) {
          const raw = target.dataset.options || "";
          field.innerHTML = "";

          if (!raw) {
            const fallback = document.createElement("option");
            fallback.value = String(originalValue ?? "");
            fallback.textContent = String(originalValue ?? "");
            field.appendChild(fallback);
            return;
          }

          const items = raw
            .split(",")
            .map(item => item.trim())
            .filter(Boolean);

          items.forEach(item => {
            const [label, value = item] = item.split("|").map(part => part.trim());
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label || value;
            field.appendChild(option);
          });

          const current = String(originalValue ?? "");
          if (Array.from(field.options).some(option => option.value === current)) {
            field.value = current;
          }
        }
      });
    };

    registerBuiltinFieldPlugins(fieldPluginRegistry);

    class InlineEdit {
      constructor(options = {}) {
        this.options = {
          selector: ".editable",
          overlaySelector: ".inline-edit-overlay",
          errorSelector: ".inline-edit-error",
          onSave: null,
          onSuccess: null,
          onError: null,
          ...options
        };

        this.overlay = document.querySelector(this.options.overlaySelector) || this._createOverlay();
        this.confirmBtn = this.overlay.querySelector(".confirm-btn");
        this.cancelBtn = this.overlay.querySelector(".cancel-btn");
        this.errorEl = document.querySelector(this.options.errorSelector) || this._createErrorEl();

        this.activeTarget = null;
        this.originalValue = "";
        this.fieldType = "text";
        this.field = null;
        this.saving = false;

        this._bindOverlayEvents();
        this._bindEditables();
        this._setActiveFieldType("text");
      }

      _bindEditables() {
        document.querySelectorAll(this.options.selector).forEach(element => {
          if (element.dataset.inlineBound === "true") return;
          element.dataset.inlineBound = "true";
          element.addEventListener("click", () => this.open(element));
        });
      }

      _bindOverlayEvents() {
        this.confirmBtn.addEventListener("click", () => this.save());
        this.cancelBtn.addEventListener("click", () => this.cancel());
      }

      _normalizeFieldType(type) {
        return fieldPluginRegistry.normalizeType(type);
      }

      _resolveFieldType(target) {
        const type = this._normalizeFieldType(target?.dataset?.type);
        if (type !== "text") return type;
        return target?.dataset?.editMultiline === "true" ? "textarea" : "text";
      }

      _createOverlay() {
        const overlay = document.createElement("div");
        overlay.className = "inline-edit-overlay";

        const actions = document.createElement("div");
        actions.className = "actions";

        const confirmBtn = document.createElement("button");
        confirmBtn.type = "button";
        confirmBtn.className = "confirm-btn";
        confirmBtn.textContent = "✓";

        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "cancel-btn";
        cancelBtn.textContent = "✕";

        actions.append(confirmBtn, cancelBtn);
        overlay.append(actions);
        document.body.appendChild(overlay);

        return overlay;
      }

      _createErrorEl() {
        const errorEl = document.createElement("div");
        errorEl.className = "inline-edit-error";
        document.body.appendChild(errorEl);
        return errorEl;
      }

      _setActiveFieldType(type) {
        const normalizedType = this._normalizeFieldType(type);
        const existingField = this.overlay.querySelector(".inline-edit-field");

        if (existingField) {
          existingField.remove();
        }

        this.fieldType = normalizedType;
        this.field = fieldPluginRegistry.createField(this.fieldType);
        this.field.dataset.inlineFieldType = this.fieldType;

        const actions = this.overlay.querySelector(".actions");
        this.overlay.insertBefore(this.field, actions);
        return this.field;
      }

      _bindActiveFieldEvents() {
        const field = this.field;
        if (!field || field.dataset.inlineBound === "true") return;
        field.dataset.inlineBound = "true";

        field.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            this.cancel();
          }

          if (event.key === "Enter") {
            if (this.fieldType === "textarea" && event.ctrlKey) {
              event.preventDefault();
              this.save();
            } else if (this.fieldType !== "textarea" && this.fieldType !== "select") {
              event.preventDefault();
              this.save();
            }
          }
        });

        field.addEventListener("blur", () => {
          setTimeout(() => {
            if (!this.saving && !this.overlay.contains(document.activeElement)) {
              this.cancel();
            }
          }, 120);
        });

        if (this.fieldType === "bool") {
          field.addEventListener("change", () => {
            this._setFieldValue(String(field.checked));
          });
        }
      }

      _setFieldValue(value) {
        fieldPluginRegistry.setValue(this.fieldType, this.field, value);
      }

      _buildFieldOptions(target) {
        fieldPluginRegistry.buildOptions(this.fieldType, target, this.field, this.originalValue);
      }

      _getFieldValue() {
        return fieldPluginRegistry.getValue(this.fieldType, this.field);
      }

      _positionOverlay(target) {
        const rect = target.getBoundingClientRect();
        this.overlay.style.top = `${rect.top - 4}px`;
        this.overlay.style.left = `${rect.right + 8}px`;

        if (rect.right + 8 + 350 > window.innerWidth) {
          this.overlay.style.left = `${rect.left}px`;
          this.overlay.style.top = `${rect.bottom + 4}px`;
        }
      }

      open(target) {
        if (this.activeTarget && this.activeTarget !== target) {
          this.cancel();
        }

        this.activeTarget = target;
        this.fieldType = this._resolveFieldType(target);
        this.originalValue = target.dataset.editValue ?? target.textContent.trim();

        this._setActiveFieldType(this.fieldType);
        this._setFieldValue(this.originalValue);
        this._buildFieldOptions(target);
        this._bindActiveFieldEvents();

        target.classList.add("editing");
        this._positionOverlay(target);
        this.overlay.classList.add("active");

        requestAnimationFrame(() => {
          const field = this.field;
          if (!field) return;
          field.focus();

          if (field.tagName !== "INPUT" || field.type !== "checkbox") {
            field.select?.();
          }
        });
      }

      async save() {
        if (this.saving || !this.activeTarget) return;

        const newValue = this._getFieldValue();
        const originalValue = this.fieldType === "bool"
          ? String(this.originalValue ?? "").toLowerCase() === "true"
          : this.originalValue;

        if (newValue === originalValue) {
          this.close();
          return;
        }

        this.saving = true;
        this.overlay.classList.add("saving");
        this._hideError();

        try {
          const url = this.activeTarget.dataset.editUrl;
          const failOn = this.activeTarget.dataset.editFailOn;
          const saveFn = this.options.onSave || this._defaultSave.bind(this);
          const result = await saveFn(url, newValue, failOn);

          if (result.success) {
            const serverValue = result.value ?? newValue;
            const displayValue = typeof serverValue === "boolean" ? String(serverValue) : serverValue;

            this.activeTarget.textContent = displayValue;
            this.activeTarget.dataset.editValue = String(displayValue);

            if (this.options.onSuccess) {
              this.options.onSuccess(serverValue, this.activeTarget);
            }

            this.close();
          } else {
            this._showError(result.message || "Save failed");
            if (this.options.onError) {
              this.options.onError(result.message, this.activeTarget);
            }
          }
        } catch (error) {
          this._showError("Network error, please retry");
        } finally {
          this.saving = false;
          this.overlay.classList.remove("saving");
        }
      }

      async _defaultSave(url, value, failOn) {
        console.log(`[AJAX] POST ${url} -> ${JSON.stringify({ value })}`);
        await new Promise(resolve => setTimeout(resolve, 600));

        if (failOn && value === failOn) {
          return { success: false, message: `"${value}" is invalid and rejected by the server` };
        }

        return { success: true, value };
      }

      cancel() {
        this._hideError();
        this.close();
      }

      close() {
        if (this.activeTarget) {
          this.activeTarget.classList.remove("editing");
        }

        this.overlay.classList.remove("active");
        this.activeTarget = null;
      }

      _showError(message) {
        const rect = this.overlay.getBoundingClientRect();
        this.errorEl.textContent = message;
        this.errorEl.style.top = `${rect.bottom + 6}px`;
        this.errorEl.style.left = `${rect.left}px`;
        this.errorEl.classList.add("active");
      }

      _hideError() {
        this.errorEl.classList.remove("active");
      }
    }

    class InlineEditController extends Controller {
      connect() {
        if (!window.inlineEditEngine) {
          window.inlineEditEngine = new InlineEdit({
            selector: ".editable",
            onSuccess: (value, target) => {
              const toast = target.closest(".card")?.querySelector(".toast");
              if (toast) {
                toast.style.display = "block";
                setTimeout(() => {
                  toast.style.display = "none";
                }, 1800);
              }
            }
          });
        }

        this.editor = window.inlineEditEngine;
      }

      open(event) {
        const target = event?.currentTarget || this.element;
        this.editor.open(target);
      }

      save() {
        this.editor.save();
      }

      cancel() {
        this.editor.cancel();
      }
    }

    const application = Application.start();
    application.register("inline-edit", InlineEditController);

    window.fieldPluginRegistry = fieldPluginRegistry;
    window.InlineEdit = InlineEdit;
  </script>
</body>
</html>
